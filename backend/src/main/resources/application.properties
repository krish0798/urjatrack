# Server
server.port=8080

# Database Configuration (Supports Render Postgres URL or local MySQL)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/urjatrack_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:local_password}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security
jwt.secret=${JWT_SECRET:local_development_secret_key_change_in_prod}
jwt.expirationMs=86400000

# Google Client ID (Frontend should use the same)
google.client-id=YOUR_GOOGLE_CLIENT_ID
